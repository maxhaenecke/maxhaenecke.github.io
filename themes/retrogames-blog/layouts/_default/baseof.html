<!doctype html>
<html lang="{{ site.LanguageCode | default site.Language.Lang }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
<div class="page">
  {{ block "main" . }}{{ end }}
</div>
<script src="/js/animations.js" defer></script>
<script>
function syncThemeToggles() {
  var dark  = document.documentElement.dataset.theme === 'dark';
  var label = dark ? 'Hellen Modus einschalten' : 'Dunkelmodus einschalten';
  document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  });
}

function toggleTheme() {
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncThemeToggles();
}

function toggleNav(force) {
  var menu   = document.getElementById('blog-nav-links');
  var burger = document.getElementById('blog-nav-burger');
  if (!menu || !burger) return;
  var isOpen = typeof force === 'boolean' ? force : !menu.classList.contains('is-open');
  menu.classList.toggle('is-open', isOpen);
  burger.classList.toggle('is-open', isOpen);
  burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  burger.setAttribute('aria-label', isOpen ? 'Menü schließen' : 'Menü öffnen');
  document.body.style.overflow = isOpen ? 'hidden' : '';
}

(function () {
  syncThemeToggles();

  document.querySelectorAll('#blog-nav-links a').forEach(function (a) {
    a.addEventListener('click', function () { toggleNav(false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') toggleNav(false);
  });
  var wide = window.matchMedia('(min-width: 700px)');
  var onWide = function () { if (wide.matches) toggleNav(false); };
  if (wide.addEventListener) wide.addEventListener('change', onWide);

  var archive = document.getElementById('archiv');

  // Startseite mit ?filter= → „Archiv“ statt „Home“ aktiv
  if (archive && new URLSearchParams(location.search).has('filter')) {
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      a.classList.toggle('is-active', a.dataset.nav === 'archive');
    });
  }

  // Auf der Startseite sanft zum Archiv scrollen statt springen
  if (archive) {
    document.querySelectorAll('a[href="/#archiv"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        toggleNav(false);
        history.pushState(null, '', location.search + '#archiv');
        scrollToEl(archive);
      });
    });
  }
}());

// Ruhiger Scroll mit fester Dauer (der native „smooth“-Scroll lässt sich nicht
// verlangsamen). Bricht ab, sobald man selbst scrollt.
function scrollToEl(el, duration) {
  var startY  = window.scrollY;
  var targetY = Math.min(
    el.getBoundingClientRect().top + startY,
    document.documentElement.scrollHeight - window.innerHeight
  );
  var dist = targetY - startY;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || Math.abs(dist) < 2) {
    window.scrollTo(0, targetY);
    return;
  }
  duration = duration || 1200;
  var t0 = null, cancelled = false;
  var stop = function () { cancelled = true; };
  var opts = { passive: true, once: true };
  window.addEventListener('wheel', stop, opts);
  window.addEventListener('touchstart', stop, opts);
  window.addEventListener('keydown', stop, opts);
  var ease = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  requestAnimationFrame(function step(now) {
    if (cancelled) return;
    if (t0 === null) t0 = now;
    var p = Math.min((now - t0) / duration, 1);
    window.scrollTo(0, startY + dist * ease(p));
    if (p < 1) requestAnimationFrame(step);
    else {
      window.removeEventListener('wheel', stop);
      window.removeEventListener('touchstart', stop);
      window.removeEventListener('keydown', stop);
    }
  });
}
</script>
</body>
</html>
