{{- $current := .current -}}
<footer class="site-footer grid">
  {{ with site.Params.footerQuote }}<p class="footer-quote t-title">{{ . }}</p>{{ end }}
  <nav class="footer-nav t-ui" aria-label="Footer-Navigation">
    <a href="/" data-nav="home" class="nav-link{{ if eq $current "home" }} is-active{{ end }}">Home</a>
    <a href="/#archiv" data-nav="archive" class="nav-link{{ if eq $current "archive" }} is-active{{ end }}">Archiv</a>
    <a href="/about/" data-nav="about" class="nav-link{{ if eq $current "about" }} is-active{{ end }}">Über</a>
  </nav>
  <div class="footer-bottom t-meta">
    {{ partial "logo.html" . }}
    <span>♥ Retro Games</span>
  </div>
</footer>
