{{- $pg := partial "pg.html" (dict "page" . "sep" " / ") -}}
<section class="hero grid pad">
  <div class="hero-meta t-meta">
    <span class="accent">Im Fokus</span>
    <span><span class="inline-only">/ </span>{{ with $pg }}{{ . }}<br class="stack-only"><span class="inline-only"> / </span>{{ end }}{{ .Date.Format "02.01.06" }}</span>
  </div>
  <a href="{{ .RelPermalink }}" class="hero-img media{{ if not .Params.image }} is-ph{{ end }}" tabindex="-1" aria-hidden="true">
    {{- with .Params.image }}
    <img src="{{ . | relURL }}" alt="" loading="eager"{{ with $.Params.image_position }} style="object-position: {{ . | safeCSS }}"{{ end }}>
    {{- end }}
  </a>
  <h2 class="hero-title t-display"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="hero-text">
    {{ with .Params.lead }}<p class="hero-lead">{{ . }}</p>{{ end }}
    <a href="{{ .RelPermalink }}" class="more t-ui" tabindex="-1" aria-hidden="true">Essay lesen <span class="arrow">→</span></a>
  </div>
</section>
