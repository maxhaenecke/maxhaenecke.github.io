{{ $page := . }}
<div class="blog-featured">
  <a href="{{ .RelPermalink }}" class="blog-featured-image{{ if not .Params.image }} ph{{ end }}">
    {{ with .Params.image }}
    <img src="{{ . | relURL }}" alt="{{ $page.Title }}" loading="lazy">
    {{ end }}
  </a>
  <div class="blog-featured-text">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <div class="blog-meta">
      {{ with .Params.platform }}<a href="/archive/?filter={{ lower . }}" class="tag">{{ . }}</a>{{ end }}
      {{ if and .Params.platform .Params.genre }}<span class="sep">·</span>{{ end }}
      {{ with .Params.genre }}<a href="/archive/?filter={{ lower . }}" class="tag">{{ . }}</a>{{ end }}
      <span class="sep">·</span>
      <span class="tag">{{ .Date.Format "02.01.06" }}</span>
    </div>
    <p>{{ .Params.lead }}</p>
    <a class="blog-more" href="{{ .RelPermalink }}">Weiterlesen</a>
  </div>
</div>
