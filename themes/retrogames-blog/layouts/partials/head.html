<meta charset="utf-8">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Params.blogName }}{{ else if eq .Kind "404" }}Nicht gefunden — {{ site.Params.blogName }}{{ else }}{{ .Title }} — {{ site.Params.blogName }}{{ end }}</title>
{{- $desc := .Description | default .Params.lead | default site.Params.description }}
<meta name="description" content="{{ $desc }}">
<meta name="theme-color" content="#fbfbf9">
{{ if ne .Kind "404" }}{{ partial "meta.html" (dict "page" . "desc" $desc) }}{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Schibsted+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<script>
(function () {
  var t;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  var root = document.documentElement;
  root.dataset.theme = t === 'dark' ? 'dark' : 'light';
  root.classList.add('js');
  // Adressleisten-Farbe (Mobil) passend zum Modus
  if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#161615';
})();
</script>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ with site.Params.accentColor }}<style>:root { --accent: {{ . | safeCSS }}; }</style>{{ end }}
