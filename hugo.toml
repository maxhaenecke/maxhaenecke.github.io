baseURL = "https://maxbacklog.de/"
languageCode = "de"
title = "Max.Backlog"
theme = "retrogames-blog"

[pagination]
  pagerSize = 10

# Nur ein RSS-Feed (Startseite); Archiv- und Taxonomie-Seiten sind reine Weiterleitungen
[outputs]
  home     = ["html", "rss"]
  section  = ["html"]
  taxonomy = ["html"]
  term     = ["html"]

[taxonomies]
  platform = "platforms"
  genre    = "genres"

[params]
  blogName    = "Max.Backlog"
  description = "Ein Blog über Spiele, die wir in unseren Erinnerungen immer noch gerne spielen."
  authorName  = "Max"
  authorBio   = "Ein paar Streiflichter auf Momente, in denen das Medium Videospiel noch auf der Suche nach neuen Genres und Gameplay-Mechaniken war, die heute ganz gewöhnlich erscheinen."
  authorImage = "/images/max.jpg"
  accentColor = "#fa7527"
  footerQuote = "Ein paar Streiflichter auf Momente, in denen das Medium Videospiel noch auf der Suche nach neuen Genres und Gameplay-Mechaniken war."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Bilder bleiben in static/images/ (absolute Pfade /images/…), sind aber zusätzlich
# als Ressource eingebunden, damit Hugo WebP-Varianten in mehreren Breiten erzeugen
# kann (partials/img.html). Wer Mounts setzt, muss die Standardordner mit angeben.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
